# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
#
# NOTE: this file must not carry machine specific network workarounds. It used to set
# -Djava.net.preferIPv6Addresses=true, because on the machine this project was developed on, Java resolves
# maven.neoforged.net to an IPv4 address whose TLS handshake the network resets, while IPv6 works. That is a
# property of one network, not of the project, and it broke every build on CI: GitHub runners have no IPv6 route,
# so forcing Java to prefer IPv6 turned into "java.net.SocketException: Network is unreachable" before a single
# dependency could be resolved.
#
# If a machine does need it, put it in the USER level gradle.properties (%USERPROFILE%\.gradle\gradle.properties),
# which is not committed, or pass it as -D on the command line. Nothing about the build should depend on which
# network it happens to run on.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=false

# Environment Properties
#
# The Minecraft version, its version range and the loader version are NOT here. They used to be, back when this was
# a single target, and leaving them here would be actively harmful now: root level properties are inherited by every
# module, so a module that forgot to override one would be compiled against another target's Minecraft without
# anything complaining. Each module under versions/ states its own.
#
# What is here is what every target genuinely shares: the mod's identity.

## Mod Properties
mod_id=tfc_food_port
mod_name=TFC Food Port
# EUPL-1.2, not MIT: this port is built from TerraFirmaCraft's code and assets, and TFC is licensed EUPL-1.2,
# which is a copyleft licence. The repository's LICENSE file says the same thing.
mod_license=EUPL-1.2
mod_version=1.0.0
mod_group_id=com.tfc_food_port
