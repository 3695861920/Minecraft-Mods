# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
#
# NOTE: this file must not carry machine specific network workarounds. It used to set
# -Djava.net.preferIPv6Addresses=true, because on the machine this project was developed on, Java resolves
# maven.neoforged.net to an IPv4 address whose TLS handshake the network resets, while IPv6 works. That is a
# property of one network, not of the project, and it broke every build on CI: GitHub runners have no IPv6 route,
# so forcing Java to prefer IPv6 turned into "java.net.SocketException: Network is unreachable" before a single
# dependency could be resolved.
#
# If a machine does need it, put it in the USER level gradle.properties (%USERPROFILE%\.gradle\gradle.properties),
# which is not committed, or pass it as -D on the command line. Nothing about the build should depend on which
# network it happens to run on.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=false

# Environment Properties
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.109

## Mod Properties
mod_id=tfc_food_port
mod_name=TFC Food Port
