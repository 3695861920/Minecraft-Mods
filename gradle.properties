# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# java.net.preferIPv6Addresses is required on this machine: Java resolves maven.neoforged.net to an IPv4
# address that the network resets during the TLS handshake, while IPv6 works fine.
org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv6Addresses=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=false

# Environment Properties
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.109

## Mod Properties
mod_id=tfc_food_port
mod_name=TFC Food Port
# EUPL-1.2, not MIT: this port is built from TerraFirmaCraft's code and assets, and TFC is licensed EUPL-1.2,
# which is a copyleft licence. The repository's LICENSE file says the same thing.
mod_license=EUPL-1.2
mod_version=1.0.0
mod_group_id=com.tfc_food_port
