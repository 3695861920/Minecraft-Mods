plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

// This module's target: Minecraft 1.21.1 on NeoForge 21.1.x.
//
// 1.21.1 is the version TerraFirmaCraft itself is built for, so this target reads TFC's data directly rather than
// through the 26.1.2 module's forward port of it. That makes it the closest thing to a "native" target this project
// can have.
//
// The NeoForge version is a dynamic selector while the target is being set up, so that Gradle reports which 21.1.x
// builds actually exist instead of failing on a version that was guessed. It is pinned to an exact version before
// anything is released.
def minecraft_version = '1.21.1'
def minecraft_version_range = '[1.21.1]'
def neo_version = '21.1.251'

// Mojang ships Java 21 with 1.21.1.
def java_version = 21

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

sourceSets.main.java {
    // The game tests are still written against 26.1.2's test framework and are excluded while the port is in
    // progress, so that the mod itself can be compiled and verified in the meantime.
    //
    // The two frameworks are genuinely different, not renamed. 26.1.2 registers tests as
    // Consumer<GameTestHelper> values in the minecraft:test_function registry and builds instances of
    // FunctionGameTestInstance from TestData, none of which exist on 1.21.1. Here a test is a method annotated
    // @GameTest in a class annotated @GameTestHolder, discovered reflectively. Converting the 24 tests means
    // rewriting their registration and adapting each body to the 1.21.1 data component and recipe APIs.
    //
    // DELETE THIS EXCLUDE in the same change that ports them.
    exclude 'com/tfc_food_port/gametest/**'
}

repositories {
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

neoForge {
    version = neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Farmer's Delight for 1.21.1. Resolved against the repository root, where the jars for every target live.
    def farmerDelightJar = rootProject.file('FarmersDelight-1.21.1-1.2.7.jar')
    if (farmerDelightJar.exists()) {
        localRuntime files(farmerDelightJar)
    } else {
        logger.lifecycle("Farmer's Delight 1.21.1 jar not found, so it is not on the runtime classpath. Building still " +
            "works; running the game to try the cooking pot recipes needs it.")
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
