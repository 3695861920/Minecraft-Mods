name: Build and release

# Builds the mod on every tag that looks like a version, and publishes the built jar to a GitHub Release.
#
# The release is published with the run's own GITHUB_TOKEN, which GitHub issues automatically. No personal access
# token is involved and no secret has to be stored in the repository.
#
# Only the mod jar is published. The generator scripts in tools/ are NOT run here, on purpose: everything they
# produce is committed under src/main/resources, so a build needs nothing but the checkout. Running them in CI would
# mean downloading a TerraFirmaCraft jar so they can read TFC's textures and data, which is a large and fragile
# extra step - and one that a public repository should not take, since that jar is not ours to fetch on its behalf.
# Regenerating is a local step: run tools/gen-*.ps1, then tools/verify-assets.ps1.

on:
  push:
    tags:
      - 'v*'
  # lets the workflow be run by hand from the Actions tab, which is how to test a build without tagging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      # Caches the Gradle distribution and the NeoForge/Minecraft artifacts between runs, which is most of the
      # build time on a cold cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      # build/libs holds the mod jar and the sources jar; a player installs the one without a classifier.
      - name: Collect the mod jar
        id: jar
        run: |
          set -euo pipefail
          jar="$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)"
          test -n "$jar"
          echo "mod jar: $jar"
          echo "path=$jar" >> "$GITHUB_OUTPUT"

      - name: Upload the jar as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfc_food_port
          path: ${{ steps.jar.outputs.path }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
          draft: false
