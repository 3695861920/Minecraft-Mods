name: Build and release

# Builds the mod on every tag that looks like a version, and publishes the built jar to a GitHub Release.
#
# The release is published with the run's own GITHUB_TOKEN, which GitHub issues automatically. No personal access
# token is involved and no secret has to be stored in the repository.
#
# Only the mod jar is published. The generator scripts in tools/ are NOT run here, on purpose: everything they
# produce is committed under src/main/resources, so a build needs nothing but the checkout. Running them in CI would
# mean downloading a TerraFirmaCraft jar so they can read TFC's textures and data, which is a large and fragile
# extra step - and one that a public repository should not take, since that jar is not ours to fetch on its behalf.
# Regenerating is a local step: run tools/gen-*.ps1, then tools/verify-assets.ps1.

on:
  push:
    tags:
      - 'v*'
  # lets the workflow be run by hand from the Actions tab, which is how to test a build without tagging
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'

      # Caches the Gradle distribution and the NeoForge/Minecraft artifacts between runs, which is most of the
      # build time on a cold cache. The version is pinned so the build never depends on whatever Gradle the runner
      # image happens to ship, and so it is fetched from services.gradle.org.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      # Printed before the build so that a failure past this point can be read with confidence: the JDK and Gradle
      # the runner resolved, and the wrapper URL - which is deliberately NOT the official one, because the official
      # URL redirects to github.com and is unreachable from the network this project is developed on.
      - name: Show the toolchain the runner resolved
        shell: bash
        run: |
          java -version
          gradle --version
          echo '--- gradle-wrapper.properties ---'
          cat gradle/wrapper/gradle-wrapper.properties

      # `gradle`, not `./gradlew`, on purpose. The wrapper is configured to fetch its distribution from a mirror,
      # which is the right thing on the development machine and the wrong thing here: the action above has already
      # installed Gradle 9.2.1 from the official source, so running the wrapper as well would download the same
      # distribution a second time, from a mirror chosen for a network this runner is not on.
      #
      # The output is teed to a file so the cause of a failure can be published as a workflow annotation. Without
      # that, a failed run only reports "Process completed with exit code 1" to anything reading the API, and the
      # actual error is locked inside the web UI.
      - name: Build
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E 'FAILURE:|error:|Caused by:|What went wrong|Could not|No matching|Permission denied|Unsupported|not found' build.log \
              | head -n 25 \
              | while IFS= read -r line; do echo "::error::$line"; done
            echo '--- last 60 lines of the build log ---'
            tail -n 60 build.log
            exit "$code"
          fi

      # build/libs holds the mod jar and the sources jar; a player installs the one without a classifier.
      - name: Collect the mod jar
        id: jar
        run: |
          set -euo pipefail
          jar="$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)"
          test -n "$jar"
          echo "mod jar: $jar"
          echo "path=$jar" >> "$GITHUB_OUTPUT"

      - name: Upload the jar as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfc_food_port
          path: ${{ steps.jar.outputs.path }}

      # Kept even when the build fails, so a failure can be diagnosed without needing access to the run's logs.
      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
          draft: false
