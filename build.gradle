// The root project builds nothing itself. It exists to declare the build tooling once and to give the repository a
// single entry point: `gradle build` builds every target under versions/.
//
// The plugin is declared here with `apply false` so that the version is stated in exactly one place while the
// plugin itself is applied by each module. That matters because modules will eventually need different tooling for
// different loaders, and a version pinned in the root keeps the NeoForge ones from drifting apart.
plugins {
    id 'net.neoforged.moddev' version '2.0.147' apply false
}

// Keeps `gradle clean` available at the root, which is the natural thing to type after a layout change.
apply plugin: 'base'

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

// `gradle build` at the root builds every target. Without this the root project has no work of its own, and a plain
// `gradle build` would succeed while producing nothing - which is a worse failure than an error, because a CI job
// that has not been told about the new layout would report a green build and publish nothing.
//
// The base plugin already creates a `build` task, so this configures that one rather than registering another.
tasks.named('build') {
    group = 'build'
    description = 'Builds every target under versions/.'
    dependsOn subprojects.collect { it.tasks.matching { task -> task.name == 'build' } }
}

// Reported as its own task so the target list is discoverable without reading settings.gradle.
//
// The list is captured at configuration time and only printed at execution time. Reading `subprojects` inside the
// action would reach back into the project model while the task runs, which the configuration cache rejects - and
// reporting a build green while discarding its cache entry is exactly the sort of thing that stays broken for
// months.
//
// Filtered to projects that have their own build file: Gradle creates a project for every path segment, so
// 'versions' appears as an intermediate that is not a target.
def targetList = subprojects.findAll { it.buildFile.exists() }
    .collect { it.path.replaceFirst('^:', '') + '   ->   ' + it.projectDir }
    .sort()

tasks.register('targets') {
    group = 'help'
    description = 'Lists the (loader, Minecraft version) targets in this repository.'
    def lines = targetList
    doLast {
        lines.each { println('  ' + it) }
    }
}
